name: Apprentice Scout brief

on:
  schedule:
    # 12:00 UTC = 8 AM ET (EDT) / 7 AM ET (EST). Mon + Thu, matching the local task.
    - cron: "0 12 * * 1,4"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: apprentice-scout
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Restore de-dupe cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: seen.json
          key: apprentice-seen-${{ github.run_id }}
          restore-keys: |
            apprentice-seen-

      - name: Scrape boards and send brief
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python apprentice_scout.py
