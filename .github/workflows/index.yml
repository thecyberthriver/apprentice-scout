name: Apprentice Scout role index

# Rebuilds roles_index.json (jobspy + employer/ATS scrape) and commits it, so the
# Cloudflare webhook can answer /search with real jobs + direct links instantly.
# Runs a few times a day; the Worker caches it for ~30 min.

on:
  schedule:
    - cron: "0 */2 * * *"   # every 2 hours — employer/ATS postings land in /search within ~2h of going live
  workflow_dispatch: {}

permissions:
  contents: write            # to commit the refreshed index

concurrency:
  group: apprentice-scout-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Build role index
        env:
          # Telegram not needed for index build, but harmless if present.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python apprentice_scout.py --build-index

      - name: Commit index if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add roles_index.json
          if git diff --staged --quiet; then
            echo "index unchanged"
          else
            git commit -m "chore: refresh roles_index.json [skip ci]"
            git push
          fi
